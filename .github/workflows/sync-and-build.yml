name: Sync upstream and build release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release right now (leave unchecked to only sync upstream)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record current HEAD
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/rrr333nnn333/BRENE.git
          git fetch upstream main

      - name: Try merging upstream
        id: merge
        run: |
          PROTECTED_FILES=("README.md" "CHANGELOG.md" ".github" "update.json" "BUILD_NUMBER" "module/module.prop" "module/webroot/index.html" "module/webroot/script.js")

          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            REAL_CONFLICT=false
            for f in $CONFLICTED; do
              FOUND=false
              for p in "${PROTECTED_FILES[@]}"; do
                if [[ "$f" == "$p" || "$f" == "$p"/* ]]; then
                  FOUND=true
                  break
                fi
              done
              if [ "$FOUND" = false ]; then
                REAL_CONFLICT=true
              fi
            done

            if [ "$REAL_CONFLICT" = true ]; then
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              git merge --abort
            else
              for f in $CONFLICTED; do
                git checkout --ours -- "$f"
                git add "$f"
              done
              git commit --no-edit
              echo "conflict=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync conflict - ${new Date().toISOString().slice(0,10)}`,
              body: "Automatic merge from upstream BRENE failed. Resolve manually:\n```\ngit fetch upstream main\ngit merge upstream/main\n# resolve conflicts\ngit add .\ngit commit\ngit push\n```"
            })

      - name: Check for new upstream commits
        if: steps.merge.outputs.conflict == 'false'
        id: diff
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          COUNT=$(git rev-list --count ${{ steps.pre.outputs.sha }}..$NEW_SHA -- module ':!CHANGELOG.md')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Re-apply customizations onto module/
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.count != '0'
        run: |
          if ! grep -q "config_sync_build_props" module/post-fs-data.sh; then
          cat >> module/post-fs-data.sh << 'BLOCK'

          #### Fully sync all build-related props (fingerprint + sub-fields) across all partitions ####
          ## Fully device-agnostic + fail-safe: never blocks boot even if resetprop errors ##
          ## Skipped during hot install (live session) -- live resetprop of build fingerprint fields
          ## is unsafe while zygote/system_server are already running; it will apply normally on
          ## the next real reboot instead. ##
          BRENE_UPTIME_SEC=$(awk '{print int($1)}' /proc/uptime 2>/dev/null || echo 0)
          if [[ "${config_sync_build_props}" == "1" && "${BRENE_UPTIME_SEC}" -lt 120 ]]; then
              RESETPROP=""
              for candidate in /data/adb/ksu/bin/resetprop /data/adb/magisk/resetprop /data/adb/ap/bin/resetprop; do
                  [[ -x "${candidate}" ]] && RESETPROP="${candidate}" && break
              done

              if [[ -n "${RESETPROP}" ]]; then
                  MAIN_FP=$(getprop ro.build.fingerprint)
                  MAIN_ID=$(getprop ro.build.id)
                  MAIN_RELEASE=$(getprop ro.build.version.release)
                  MAIN_SDK=$(getprop ro.build.version.sdk)
                  MAIN_SDK_FULL=$(getprop ro.build.version.sdk_full)
                  MAIN_INCREMENTAL=$(getprop ro.build.version.incremental)
                  MAIN_RELEASE_CODENAME=$(getprop ro.build.version.release_or_codename)

                  FIELDS="fingerprint id version.release version.sdk version.incremental version.release_or_codename version.sdk_full"

                  if [[ "${config_brene_logs}" == "1" ]]; then
                      {
                          echo ""
                          echo "########################"
                          echo "Build Props Spoofing"
                          echo "########################"
                      } >> "${PERSISTENT_DIR}/logs.txt"
                  fi

                  if [[ -n "${MAIN_FP}" ]]; then
                      DISCOVERED_PARTS=$(getprop | grep -oE '^\[ro\.[a-z0-9_]+\.build\.fingerprint\]' | sed -E 's/^\[ro\.([a-z0-9_]+)\.build\.fingerprint\]$/\1/')

                      for part in ${DISCOVERED_PARTS}; do
                          [[ "${part}" == "build" ]] && continue
                          [[ "${part}" == "bootimage" ]] && continue

                          for field in ${FIELDS}; do
                              prop_name="ro.${part}.build.${field}"
                              current_value=$(getprop "${prop_name}")

                              if [[ -n "${current_value}" ]]; then
                                  case "${field}" in
                                      fingerprint) new_value="${MAIN_FP}" ;;
                                      id) new_value="${MAIN_ID}" ;;
                                      version.release) new_value="${MAIN_RELEASE}" ;;
                                      version.sdk) new_value="${MAIN_SDK}" ;;
                                      version.incremental) new_value="${MAIN_INCREMENTAL}" ;;
                                      version.release_or_codename) new_value="${MAIN_RELEASE_CODENAME}" ;;
                                      version.sdk_full) new_value="${MAIN_SDK_FULL}" ;;
                                  esac

                                  if [[ "${current_value}" != "${new_value}" ]]; then
                                      timeout 3 "${RESETPROP}" "${prop_name}" "${new_value}" 2>/dev/null || true
                                      if [[ "${config_brene_logs}" == "1" ]]; then
                                          echo "[sync_prop]: ${prop_name}: ${current_value} -> ${new_value}" >> "${PERSISTENT_DIR}/logs.txt"
                                      fi
                                  fi
                              fi
                          done
                      done
                  fi
              fi
          fi
          BLOCK
          fi

          if ! grep -q "config_sync_build_props" module/config.sh; then
            echo "config_sync_build_props=0" >> module/config.sh
          fi

          if ! grep -q 'id="sync_build_props"' module/webroot/index.html; then
            LN=$(grep -n 'card-row__title">Custom Uname Spoofing<' module/webroot/index.html | head -1 | cut -d: -f1)
            if [ -n "$LN" ]; then
              INS=$((LN - 2))
              cat > /tmp/insert_card.txt << 'CARD'
          					<div class="card-row">
          						<div class="card-row__body">
          							<span class="card-row__title">Build Props Spoofing</span>
          							<span class="card-row__sub">Spoof build fingerprint fields across all partitions to match the main ro.build.fingerprint</span>
          							<span class="card-row__tag--code">Example of detections: Build Field Coherence</span>
          						</div>
          						<md-switch icons id="sync_build_props"></md-switch>
          						<md-ripple></md-ripple>
          					</div>

          CARD
              awk -v ins="$INS" -v file=/tmp/insert_card.txt '
                NR==ins { while ((getline line < file) > 0) print line }
                { print }
              ' module/webroot/index.html > /tmp/index_new.html
              mv /tmp/index_new.html module/webroot/index.html
            fi
          fi

          if ! grep -q "'sync_build_props'" module/webroot/script.js; then
            sed -i "s/{ id: 'enable_log' },/{ id: 'enable_log' },\n\t{ id: 'sync_build_props' },/" module/webroot/script.js
          fi

          sed -i "s/^name=.*/name=.BRENE - Custom AI/" module/module.prop
          sed -i "s/^author=.*/author=rrr333nnn333, simonpunk \& KOWX712 + Community/" module/module.prop
          if grep -q "^updateJson=" module/module.prop; then
            sed -i "s#^updateJson=.*#updateJson=https://raw.githubusercontent.com/Tomkun-desu/BRENE/main/update.json#" module/module.prop
          else
            echo "updateJson=https://raw.githubusercontent.com/Tomkun-desu/BRENE/main/update.json" >> module/module.prop
          fi

      - name: Capture diff against pure upstream
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true' 
        run: |
          rm -rf /tmp/upstream_pure
          mkdir -p /tmp/upstream_pure
          git archive upstream/main -- module | tar -x -C /tmp/upstream_pure
          diff -ruN /tmp/upstream_pure/module module | head -c 40000 > /tmp/custom.diff || true

      - name: Summarize with Cloudflare Workers AI (free)
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true' 
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ ! -s /tmp/custom.diff ]; then
            echo "- No local changes this build." > /tmp/ai_summary.md
          else
            RESPONSE=$(jq -n --rawfile diff /tmp/custom.diff '
              {
                messages: [
                  {role: "system", content: "You summarize code diffs in plain, simple bullet points for non-technical readers. One line per change. No code snippets. No headers."},
                  {role: "user", content: ("This is a diff comparing a customized KernelSU/SuSFS module fork against its pure upstream original. Summarize what was locally added, changed, or removed:\n\n" + $diff)}
                ]
              }' | curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.1-8b-instruct" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @-)

            echo "$RESPONSE" > /tmp/cf_raw_response.json
            echo "$RESPONSE" | jq -r '.result.response // empty' > /tmp/ai_summary.md

            if [ ! -s /tmp/ai_summary.md ]; then
              echo "- (summary unavailable this run)" > /tmp/ai_summary.md
              echo "---- raw Cloudflare response (debug) ----"
              cat /tmp/cf_raw_response.json
            fi
          fi
          cat /tmp/ai_summary.md

      - name: Build changelog and release
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true' 
        id: build
        run: |
          DATE=$(date -u +%Y-%m-%d)

          UPSTREAM_VER=$(git show upstream/main:module/module.prop | grep '^version=' | grep -oE 'v[0-9.]+' | head -1)
          [ -z "$UPSTREAM_VER" ] && UPSTREAM_VER="v0.0.0"

          LAST_VER=$(cat LAST_UPSTREAM_VERSION 2>/dev/null || echo "")
          if [[ "$UPSTREAM_VER" != "$LAST_VER" ]]; then
            RUN_NUM=1
          else
            PREV_NUM=$(cat BUILD_NUMBER 2>/dev/null || echo 0)
            RUN_NUM=$((PREV_NUM + 1))
          fi
          echo "$RUN_NUM" > BUILD_NUMBER
          echo "$UPSTREAM_VER" > LAST_UPSTREAM_VERSION

          UPSTREAM_LOG=$(git log --pretty=format:"- %s" ${{ steps.pre.outputs.sha }}..${{ steps.diff.outputs.new_sha }} -- module ':!CHANGELOG.md' 2>/dev/null || echo "")
          [ -z "$UPSTREAM_LOG" ] && UPSTREAM_LOG="- (manual rebuild, no new upstream commits)"

          BUILD_VERSION="${UPSTREAM_VER}-custom.${RUN_NUM}"

          {
            echo "## ${BUILD_VERSION} - ${DATE}"
            echo ""
            echo "### Synced from upstream BRENE"
            echo "$UPSTREAM_LOG"
            echo ""
            echo "### Local customizations"
            cat /tmp/ai_summary.md
            echo ""
          } > /tmp/new_entry.md

          cat /tmp/new_entry.md CHANGELOG.md > /tmp/full_changelog.md
          mv /tmp/full_changelog.md CHANGELOG.md

          sed -i "s/^version=.*/version=${BUILD_VERSION}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${RUN_NUM}/" module/module.prop

          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "run_num=${RUN_NUM}" >> "$GITHUB_OUTPUT"

      - name: Update update.json
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true' 
        run: |
          cat > update.json << EOF
          {
            "version": "${{ steps.build.outputs.build_version }}",
            "versionCode": ${{ steps.build.outputs.run_num }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.build.outputs.build_version }}/BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOF

      - name: Commit and push
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true'
        run: |
          git add module update.json CHANGELOG.md BUILD_NUMBER LAST_UPSTREAM_VERSION
          git commit -m "release: ${{ steps.build.outputs.build_version }}"
          git push origin main

      - name: Commit and push (sync only, no release)
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.count != '0' && github.event.inputs.publish != 'true'
        run: |
          git add module
          if git diff --cached --quiet; then
            echo "No local customization changes to commit."
          else
            git commit -m "chore: sync upstream changes (no release published)"
          fi
          git push origin main

      - name: Zip module (only module/ contents at zip root)
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true' 
        run: |
          cd module
          zip -r9 "../BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip" . -x ".git*"
          cd ..

      - name: Create Release
        if: steps.merge.outputs.conflict == 'false' && github.event.inputs.publish == 'true' 
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.build.outputs.build_version }}"
          name: "BRENE Custom AI ${{ steps.build.outputs.build_version }}"
          body_path: /tmp/new_entry.md
          files: "BRENE-Custom-AI-${{ steps.build.outputs.build_version }}.zip"
